<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-menu">
        <button id="account-button" class="account-button" type="button" aria-expanded="false" aria-controls="account-panel" aria-label="Open teacher login">
          <span aria-hidden="true">&#128100;</span>
        </button>
        <div id="account-panel" class="account-panel hidden" aria-live="polite">
          <p id="account-status">Teacher access</p>
          <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username" />
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password" />
            <button type="submit">Log in</button>
          </form>
          <button id="logout-button" class="secondary-button hidden" type="button">Log out</button>
          <div id="auth-message" class="hidden" role="status"></div>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-notice" class="info">Teacher login is required to register or unregister students.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
